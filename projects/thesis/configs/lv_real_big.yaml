# lv_real with the coupled-system sizing directive applied: bigger
# population (many candidates tie on the same Pareto level in the 4-dim
# per-equation objective space) and a looser terms cap (the sparsity
# regularizer prunes reliably, so the cap is not the parsimony lever).
# Everything else mirrors configs/lv_real.yaml.
name: lv_real_big
adapter: lv_real

truth_equations:
  - "0.5 * u{power: 1.0} + -0.03 * u{power: 1.0} * v{power: 1.0} = du/dx0{power: 1.0}"
  - "0.03 * u{power: 1.0} * v{power: 1.0} + -0.8 * v{power: 1.0} = dv/dx0{power: 1.0}"

adapter_kwargs:
  densify: 10

search:
  boundary: 10

preprocessor:
  type: poly
  kwargs:
    polynomial_window: 21
    poly_order: 4

moeadd:
  population_size: 64
  training_epochs: 18

additional_tokens: []

fit:
  equation_terms_max_number: 8
  data_fun_pow: 1
  max_deriv_order: [1]
  equation_factors_max_number:
    factors_num: [1, 2]
    probas: [0.7, 0.3]
  eq_sparsity_interval: [1.0e-8, 1.0]
