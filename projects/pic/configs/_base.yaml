# Common protocol for every data set.
#
# The idea (from the group's former benchmark): one
# broad token pool and one set of evolutionary settings for all problems, so
# the user does not tune the pool per problem. Data-set files only add what a
# problem cannot do without (a special token, a longer boundary, a bigger
# population for coupled systems).
#
# The search section is passed to the search object unchanged; every key has a
# documented default in the library.

loader: {}                       # keyword arguments of the data-set loader

search:
  domain:
    boundary_width: auto         # 10 % of each axis is dropped at the edges
  preprocessing:
    default_preprocessor_type: FD
    preprocessor_kwargs: {}
    max_deriv_order: auto        # 2 in time, 4 in every space axis
  search_space:
    data_fun_pow: 3              # u, u^2, u^3
    deriv_fun_pow: 2             # u_x, (u_x)^2
    equation_terms_max_number: 10
    equation_factors_max_number:
      factors_num: [1, 2]
      probas: [0.65, 0.35]
    tokens:
      - {family: grid, labels: [x], max_power: 2}                       # coordinates x^1, x^2
      - {family: fixed_trigonometric, freq: 2.0}                        # sin/cos(2 x_k) with exactly one frequency
  objectives: {}                 # shipped defaults: percentage discrepancy, instability, variance-weighted sparsity
  solver:
    use_solver: false
    device: cpu                  # the solver is off, so the GPU is not used anyway
  evolution:
    population_size: 16
    training_epochs: 5
  runtime:
    # candidate_objectives: EPDE's per-offspring debug output; it does not affect
    # the search and would flood notebook outputs and run logs.
    verbose_params: {show_iter_idx: false, candidate_objectives: false}
    # Cache for evaluated terms, % of TOTAL RAM per process. EPDE's default
    # (15) asserts that much is free at start, which fails as soon as several
    # runs share a 16 GB machine; 2 % (~330 MB there) is enough for the
    # data sets here.
    memory_for_cache: 2
