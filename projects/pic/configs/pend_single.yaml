# Real single pendulum: a long smoothing window for the encoder noise and a
# small pool (no trigonometric family: at this amplitude sin(theta) = theta).
# Settings from the group's former configuration.
search:
  domain: {boundary_width: 60}
  preprocessing:
    default_preprocessor_type: poly
    preprocessor_kwargs: {polynomial_window: 51, poly_order: 4}
    max_deriv_order: [2]
  search_space:
    data_fun_pow: 1
    deriv_fun_pow: 1
    equation_terms_max_number: 4
    equation_factors_max_number: {factors_num: [1, 2], probas: [0.8, 0.2]}
    tokens:
      - {family: grid, labels: [x], max_power: 2}
  evolution: {population_size: 16, training_epochs: 12}
