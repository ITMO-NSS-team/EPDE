# Darcy flow, ported from the group's original script; untested because the
# data files are missing. Stationary problem on a dummy 2-level time axis: no
# time derivatives, no boundary trimming.
search:
  domain: {boundary_width: 0}
  preprocessing: {max_deriv_order: [0, 2, 2]}
  search_space:
    data_fun_pow: 1
    equation_terms_max_number: 5
    equation_factors_max_number: {factors_num: [1, 2], probas: [0.5, 0.5]}
    tokens: []
  evolution: {population_size: 8, training_epochs: 30}
