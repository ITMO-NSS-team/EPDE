# Real double pendulum. sin(theta_i) and the coupling factors cos/sin(theta1 -
# theta2) are added by the loader. Settings from the group's former configuration.
search:
  domain: {boundary_width: 60}
  preprocessing:
    default_preprocessor_type: poly
    preprocessor_kwargs: {polynomial_window: 51, poly_order: 4}
    max_deriv_order: [2]
  search_space:
    data_fun_pow: 1
    deriv_fun_pow: 2
    equation_terms_max_number: 5
    equation_factors_max_number: {factors_num: [1, 2], probas: [0.5, 0.5]}
    tokens:
      - {family: grid, labels: [x], max_power: 2}
  evolution: {population_size: 30, training_epochs: 20}
